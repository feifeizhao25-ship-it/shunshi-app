name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shunshi-cn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reject analyzer errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify production release contracts
        run: python3 scripts/verify_production_release.py
      - run: flutter test --no-pub
      - name: Build web release
        run: >-
          flutter build web --release
          --dart-define=SHUNSHI_API_BASE_URL=https://ci.invalid
      - name: Validate production Web container definition
        run: >-
          docker build -f Dockerfile.web
          --build-arg SHUNSHI_API_BASE_URL=https://ci.invalid
          --tag shunshi-web:${{ github.sha }} .
      - name: Build Android release smoke artifact
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: >-
          flutter build apk --release
          --dart-define=SHUNSHI_API_BASE_URL=https://ci.invalid

  release-build-guard:
    name: Release build must fail without API base URL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      # 回归保护：AppConfig 在 kReleaseMode 下缺 SHUNSHI_API_BASE_URL 会抛错，
      # 但这条约束曾被绕过 —— network_service.dart 自建 Dio 时直接硬编码
      # 'http://localhost:4000/api/v1'，上架包因此连不上任何后端。
      # 上面的 job 总是带 --dart-define，无法暴露此类绕过；
      # 这里反过来验证「不给该变量时 release 构建必须失败」。
      - name: Expect failure when SHUNSHI_API_BASE_URL is absent
        run: |
          if flutter build web --release; then
            echo "::error::Release build succeeded without SHUNSHI_API_BASE_URL — 说明存在绕过 AppConfig 的硬编码地址"
            exit 1
          fi
          echo "OK: release build correctly rejected missing SHUNSHI_API_BASE_URL"
