<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="顺时 ShunShi - AI 养生陪伴系统，随时随地守护您的健康">
  <meta name="keywords" content="中医,养生,AI健康,健康陪伴,二十四节气,顺时养生">
  <meta name="author" content="ShunShi">

  <!-- Open Graph -->
  <meta property="og:title" content="顺时 ShunShi - AI 养生陪伴">
  <meta property="og:description" content="AI 养生陪伴系统，随时随地守护您的健康">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">

  <!-- Theme Color（与应用主色一致：鼠尾草绿） -->
  <meta name="theme-color" content="#6B7E5E">
  <meta name="msapplication-navbutton-color" content="#6B7E5E">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="顺时养生">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>顺时 ShunShi - AI 养生陪伴</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #F8F6F1;
      min-height: 100vh;
    }
    /* 首帧白屏兜底：纯 HTML/CSS 加载层，Flutter 首帧渲染后淡出移除 */
    .loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #6B7E5E;
      background: linear-gradient(135deg, #F8F6F1 0%, #F0EDE6 50%, #F5F3EF 100%);
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(139, 158, 126, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 1.25rem;
      animation: breathe 2.4s ease-in-out infinite;
    }
    .loading h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #2C2C2C;
    }
    .loading p {
      font-size: 0.95rem;
      opacity: 0.7;
      margin: 0 0 2rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(107, 126, 94, 0.2);
      border-top-color: #6B7E5E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="logo">🌿</div>
    <h1>顺 时</h1>
    <p>顺时加载中，请稍候…</p>
    <div class="spinner"></div>
  </div>
  <script>
    (function () {
      var removed = false;
      function hideLoading() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('loading');
        if (!el) return;
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 450);
      }
      // Flutter 3.x 部分版本会派发 flutter-first-frame；3.38 默认 bootstrap 不再派发，
      // 因此同时轮询引擎视图（flt-glass-pane 出现子节点即首帧已上屏），双保险。
      window.addEventListener('flutter-first-frame', hideLoading);
      var poll = setInterval(function () {
        var pane = document.querySelector('flt-glass-pane');
        if (pane && pane.childElementCount > 0) {
          clearInterval(poll);
          hideLoading();
        }
      }, 100);
      // 兜底：极端情况下 30s 后也必须让出页面
      setTimeout(function () { clearInterval(poll); hideLoading(); }, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
