workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      groups:
        - shunshi_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shunshi.app
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Verify production release contracts
        script: |
          python3 scripts/verify_production_release.py
          test -n "$SHUNSHI_API_BASE_URL" || {
            echo "SHUNSHI_API_BASE_URL is required"
            exit 1
          }
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed iOS archive
        script: >-
          flutter build ipa --release
          --export-options-plist=/Users/builder/export_options.plist
          --dart-define=SHUNSHI_API_BASE_URL="$SHUNSHI_API_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-workflow:
    name: Android Production Build
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      java: 17
      groups:
        - shunshi_production
      android_signing:
        - shunshi_release
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Verify production release contracts
        script: |
          python3 scripts/verify_production_release.py
          test -n "$SHUNSHI_API_BASE_URL" || {
            echo "SHUNSHI_API_BASE_URL is required"
            exit 1
          }
      - name: Build signed Android App Bundle
        script: >-
          flutter build appbundle --release
          --dart-define=SHUNSHI_API_BASE_URL="$SHUNSHI_API_BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
